{% extends 'core/base.html' %}

{% block main %}
<div class="max-w-2xl mx-auto py-10 px-4 sm:px-6 lg:px-8 mt-10">
    <div class="bg-white shadow overflow-hidden sm:rounded-lg border-2 border-red-500">
        <div class="px-4 py-5 sm:px-6 bg-red-600 border-b border-red-700">
            <h4 class="text-lg leading-6 font-bold text-white flex items-center gap-2 m-0">
                <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                Confirm Deletion
            </h4>
        </div>
        <div class="px-4 py-5 sm:p-6">
            <p class="text-lg text-gray-900 mb-2">
                Are you sure you want to delete the research work: <strong class="font-bold">{{ object.title }}</strong>?
            </p>
            <p class="text-sm text-gray-500 mb-6">
                This action cannot be undone.
            </p>

            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div class="flex gap-3 justify-end mt-8 border-t border-gray-200 pt-6">
                    <a href="{% url 'thesis_detail' object.pk %}" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                        Cancel
                    </a>
                    <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                        <svg class="mr-2 -ml-1 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        Confirm Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

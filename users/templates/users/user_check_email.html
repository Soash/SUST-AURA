{% extends 'core/base.html' %}

{% block main %}
<div class="min-h-[70vh] bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-indigo-100 mb-4">
            <svg class="h-6 w-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        </div>
        <h2 class="text-3xl font-extrabold text-gray-900">
            Check Your Email
        </h2>
        <p class="mt-4 text-base text-gray-600">
            We have sent an email with an activation link to your email address. Please check your inbox and click the link to activate your account.
        </p>
        <div class="mt-6">
            <a href="{% url 'user_login' %}" class="font-medium text-indigo-600 hover:text-indigo-500">
                Go to Login
            </a>
        </div>
    </div>
</div>
{% endblock main %}

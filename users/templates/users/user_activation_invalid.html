{% extends 'core/base.html' %}

{% block main %}
<div class="min-h-[70vh] bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
            <svg class="h-6 w-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        <h2 class="text-3xl font-extrabold text-gray-900">
            Activation Link Invalid
        </h2>
        <p class="mt-4 text-base text-gray-600">
            The activation link is invalid or has expired. Please try registering again or contact support if you continue to have issues.
        </p>
        <div class="mt-6">
            <a href="{% url 'user_registration' %}" class="font-medium text-indigo-600 hover:text-indigo-500">
                &larr; Back to Registration
            </a>
        </div>
    </div>
</div>
{% endblock main %}
